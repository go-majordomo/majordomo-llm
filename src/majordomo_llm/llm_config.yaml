anthropic:
  models:
    # supports_structured_outputs enables native constrained decoding
    # (output_config.format). Set from a live N=10 harness (10/10 conforming,
    # 0 empty) — the docs "supported models" table is stale, so gate on the
    # live API, not the table. Models left without the flag use the forced-tool
    # fallback, which is also reliable now that it sends the strict schema and
    # rejects/retries empty results.
    #
    # Current flagship models. supports_temperature_top_p is false across the
    # 4.7+ / 5 generation (temperature/top_p are rejected).
    #
    # The 5.5 / 5.1 generation rejects a forced tool_choice ("tool" / "any") with
    # a 400, so those entries set supports_forced_tool_choice: false and must
    # keep supports_structured_outputs: true. Thinking cannot be disabled on
    # them, and claude-opus-5-5 defaults to medium effort where claude-opus-5
    # defaults to high — set reasoning_effort on a profile entry to pin it.
    # Rates from the Anthropic pricing page, 2026-10-06.
    claude-opus-5-5:
      supports_image_input: true
      input_cost: 4.00
      output_cost: 20.00
      cached_input_cost: 0.20
      cache_write_cost: 5.00
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
      supports_forced_tool_choice: false
    claude-sonnet-5-5:
      supports_image_input: true
      input_cost: 2.00
      output_cost: 10.00
      cached_input_cost: 0.20
      cache_write_cost: 2.50
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
      supports_forced_tool_choice: false
    claude-fable-5-1:
      supports_image_input: true
      input_cost: 10.00
      output_cost: 50.00
      cached_input_cost: 0.25
      cache_write_cost: 12.50
      supports_temperature_top_p: false
      supports_structured_outputs: true
      supports_forced_tool_choice: false
    # Released 2026-10-07. Unlike the rest of the 5.5 generation it accepts a
    # forced tool_choice. Priced by prompt length: the rates here apply to
    # prompts of <=100K input tokens; a longer prompt bills every token class
    # at 5x ($0.50 / $2.50, cache read $0.05, write $0.625). Lower tier
    # registered here, so cost is understated 5x on prompts over 100K.
    # supports_web_search is left off until confirmed against the live API.
    claude-haiku-5-5:
      supports_image_input: true
      input_cost: 0.10
      output_cost: 0.50
      cached_input_cost: 0.01
      cache_write_cost: 0.125
      supports_temperature_top_p: false
      supports_structured_outputs: true
    claude-opus-5:
      supports_image_input: true
      input_cost: 5.00
      output_cost: 25.00
      cached_input_cost: 0.50
      cache_write_cost: 6.25
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
    claude-fable-5:
      supports_image_input: true
      input_cost: 10.00
      output_cost: 50.00
      cached_input_cost: 1.00
      cache_write_cost: 12.50
      supports_temperature_top_p: false
      supports_structured_outputs: true
    claude-opus-4-8:
      supports_image_input: true
      input_cost: 5.00
      output_cost: 25.00
      cached_input_cost: 0.50
      cache_write_cost: 6.25
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
    # Effort/thinking profiles of claude-opus-4-8 (same SKU via the `model`
    # override; costs/flags are duplicated because entries don't inherit).
    #   -fast    low effort, no thinking    — latency- and cost-sensitive
    #   -medium  medium effort + adaptive   — balanced
    #   -deep    xhigh effort + adaptive    — hardest reasoning/agentic work
    claude-opus-4-8-fast:
      supports_image_input: true
      model: claude-opus-4-8
      input_cost: 5.00
      output_cost: 25.00
      cached_input_cost: 0.50
      cache_write_cost: 6.25
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
      reasoning_effort: low
    claude-opus-4-8-medium:
      supports_image_input: true
      model: claude-opus-4-8
      input_cost: 5.00
      output_cost: 25.00
      cached_input_cost: 0.50
      cache_write_cost: 6.25
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
      thinking: adaptive
      reasoning_effort: medium
    claude-opus-4-8-deep:
      supports_image_input: true
      model: claude-opus-4-8
      input_cost: 5.00
      output_cost: 25.00
      cached_input_cost: 0.50
      cache_write_cost: 6.25
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
      thinking: adaptive
      reasoning_effort: xhigh
    # $2/$10 launched as introductory pricing and is now the standard rate; the
    # increase to $3/$15 scheduled for 2026-09-01 was cancelled.
    claude-sonnet-5:
      supports_image_input: true
      input_cost: 2.00
      output_cost: 10.00
      cached_input_cost: 0.20
      cache_write_cost: 2.50
      supports_temperature_top_p: false
      supports_web_search: true
      supports_structured_outputs: true
    # Claude 4.5, 4.6 and 4.7 (claude-opus-4-5-20251101, claude-haiku-4-5-20251001,
    # claude-opus-4-6, claude-sonnet-4-6, claude-opus-4-7) were removed 2026-10-11.
    # Anthropic still serves them; they are simply no longer registered here.
    # claude-sonnet-4-5-20250929 is the exception, mapped in deprecated_models.

