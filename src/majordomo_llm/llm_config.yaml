# LLM Provider Configuration
# Costs are specified in USD per million tokens.

openai:
  models:
    # GPT-5.4 family (latest)
    gpt-5.4:
      input_cost: 2.50
      output_cost: 15.00
      supports_temperature_top_p: false
    gpt-5.4-mini:
      input_cost: 0.75
      output_cost: 4.50
      supports_temperature_top_p: false
    gpt-5.4-nano:
      input_cost: 0.20
      output_cost: 1.25
      supports_temperature_top_p: false
    gpt-5.4-pro:
      input_cost: 30.00
      output_cost: 180.00
      supports_temperature_top_p: false
    # GPT-5 family
    gpt-5:
      input_cost: 1.25
      output_cost: 10.00
      supports_temperature_top_p: false
    gpt-5-mini:
      input_cost: 0.25
      output_cost: 2.00
      supports_temperature_top_p: false
    gpt-5-nano:
      input_cost: 0.05
      output_cost: 0.40
      supports_temperature_top_p: false
    # GPT-4.1 family
    gpt-4.1:
      input_cost: 2.00
      output_cost: 8.00
    gpt-4.1-mini:
      input_cost: 0.40
      output_cost: 1.60
    gpt-4.1-nano:
      input_cost: 0.10
      output_cost: 0.40
    # o-series reasoning models
    o3:
      input_cost: 2.00
      output_cost: 8.00
      supports_temperature_top_p: false
    o4-mini:
      input_cost: 1.10
      output_cost: 4.40
      supports_temperature_top_p: false

anthropic:
  models:
    # Claude 4.6 family (latest)
    claude-opus-4-6:
      input_cost: 5.00
      output_cost: 25.00
    claude-sonnet-4-6:
      input_cost: 3.00
      output_cost: 15.00
    # Claude 4.5 family
    claude-opus-4-5-20251101:
      input_cost: 5.00
      output_cost: 25.00
    claude-sonnet-4-5-20250929:
      input_cost: 3.00
      output_cost: 15.00
      supports_temperature_top_p: false
    claude-haiku-4-5-20251001:
      input_cost: 1.00
      output_cost: 5.00
      supports_temperature_top_p: false
    # Claude 4 family
    claude-opus-4-1-20250805:
      input_cost: 15.00
      output_cost: 75.00
    claude-opus-4-20250514:
      input_cost: 15.00
      output_cost: 75.00
    claude-sonnet-4-20250514:
      input_cost: 3.00
      output_cost: 15.00

gemini:
  models:
    # Gemini 3 family
    gemini-3.1-pro-preview:
      input_cost: 2.00
      output_cost: 12.00
    gemini-3-flash-preview:
      input_cost: 0.50
      output_cost: 3.00
    gemini-3.1-flash-lite-preview:
      input_cost: 0.25
      output_cost: 1.50
    # Gemini 2.5 family
    gemini-2.5-pro:
      input_cost: 1.25
      output_cost: 10.00
    gemini-2.5-flash:
      input_cost: 0.30
      output_cost: 2.50
    gemini-2.5-flash-lite:
      input_cost: 0.10
      output_cost: 0.40

deepseek:
  models:
    deepseek-chat:
      input_cost: 0.28
      output_cost: 0.42
    deepseek-reasoner:
      input_cost: 0.28
      output_cost: 1.68

cohere:
  models:
    command-a-03-2025:
      input_cost: 2.50
      output_cost: 10.00
    command-r-plus-08-2024:
      input_cost: 2.50
      output_cost: 10.00
    command-r-08-2024:
      input_cost: 0.50
      output_cost: 1.50
    command-r7b-12-2024:
      input_cost: 0.0375
      output_cost: 0.15

# Deprecated model mappings
# When a user requests a deprecated model, it is automatically replaced with
# the provider-recommended replacement and a warning is logged.
deprecated_models:
  openai:
    gpt-4o: gpt-4.1
    gpt-4o-mini: gpt-4.1-mini
    gpt-5-pro: gpt-5.4-pro
    o1: o3
    o3-mini: o4-mini
  anthropic:
    claude-3-7-sonnet-20250219: claude-sonnet-4-6
    claude-3-5-haiku-20241022: claude-haiku-4-5-20251001
    claude-3-haiku-20240307: claude-haiku-4-5-20251001
  gemini:
    gemini-3-pro-preview: gemini-3.1-pro-preview
    gemini-2.0-flash: gemini-2.5-flash
    gemini-2.0-flash-lite: gemini-2.5-flash-lite

# Logical model aliases
# Single provider: alias_name: { provider: ..., model: ... }
# Cascade (failover): alias_name: { cascade: [{ provider: ..., model: ... }, ...] }
aliases:
  fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
  thinking:
    provider: anthropic
    model: claude-sonnet-4-6
  smart:
    provider: anthropic
    model: claude-opus-4-6
  cheap:
    provider: gemini
    model: gemini-2.5-flash-lite
  resilient-sonnet:
    cascade:
      - provider: anthropic
        model: claude-sonnet-4-20250514
      - provider: openai
        model: gpt-4.1
      - provider: gemini
        model: gemini-2.5-pro
