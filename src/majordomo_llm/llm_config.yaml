      supports_temperature_top_p: false
    # Sonnet 4.6 is not yet available on Bedrock Mantle (returns 404
    # not_found_error). Add when AWS lists it on the platform.claude.com page.
    anthropic.claude-haiku-4-5:
      input_cost: 1.00
      output_cost: 5.00
      cached_input_cost: 0.10
      cache_write_cost: 1.25
      supports_temperature_top_p: false

# Fireworks AI (OpenAI-compatible). Serverless inference only.
# Model IDs are fully qualified: accounts/fireworks/models/<slug>.
# Older Fireworks SKUs bill cached prompt tokens at the input rate, so their
# cached_input_cost is left unset (cached reads bill at input_cost). Newer SKUs
# (kimi-k3, glm-5p3) expose a discounted cache tier and set cached_input_cost.
#
# Removed 2026-10-11, each on a live HTTP 404 "Model not found, inaccessible,
# and/or not deployed":
#   - deepseek-v4-pro and its -reasoning / -hard profiles. Deprecated from
#     serverless 2026-08-27; the 0813 successor was decommissioned 2026-09-25.
#   - kimi-k2p6 and glm-5p2. Decommissioned from serverless 2026-09-25; Fireworks
#     names glm-5p3 (or kimi-k3) as the replacement.
#   - glm-5p1. Its model page lists serverless as not supported.
# Dates are from docs.fireworks.ai/updates/changelog. Do not trust the model
# pages for availability: glm-5p2's still read "Serverless: Supported" two
# weeks after the decommission.
fireworks:
  models:
    # Reasoning on Fireworks, measured 2026-10-11 with a one-word classification
    # prompt (output tokens, of which reasoning):
    #   glm-5p3            default 86   low 7    high 5    cannot be disabled (400:
    #                      "GLM-5.3 is a thinking-only model")
    #   kimi-k3            default 135 (121)   low 47 (33)   disabled 8 (0)
    #   qwen3p8-*          default ~77 (~73)   low ~42 (~38)  disabled 2 (0)
    #   inkling            ~80 under every setting; no control has any effect
    # Every model reasons at its top tier when nothing is sent, and reasoning
    # tokens bill as output, so every entry that can be lowered sets
    # reasoning_effort: low. Inkling is the exception: nothing changes it.
    #
    # Rates from the Fireworks model page; a direct call returned 200 on
    # 2026-10-11. Fireworks names this as the replacement for GLM 5.2.
    # reasoning_effort: low brings it in line with the same weights on Baseten,
    # which returned 4 output tokens for the prompt above; left at the default it
    # produced six times Baseten's output tokens across the demo prompts.
    accounts/fireworks/models/glm-5p3:
      input_cost: 1.40
      output_cost: 4.40
      cached_input_cost: 0.26
      reasoning_effort: low
    accounts/fireworks/models/kimi-k3:
      input_cost: 3.00
      output_cost: 15.00
      cached_input_cost: 0.30
      reasoning_effort: low
    # Qwen 3.8. Standard-tier rates from the Fireworks model pages; a direct call
    # to each returned 200 on 2026-10-11. qwen3p7-max, qwen3p7-plus and
    # qwen3p6-plus returned 404 on the same run and are not registered.
    accounts/fireworks/models/qwen3p8-2p4t-a95b:
      input_cost: 2.00
      output_cost: 6.00
      cached_input_cost: 0.25
      reasoning_effort: low
    accounts/fireworks/models/qwen3p8-max:
      input_cost: 2.00
      output_cost: 6.00
      cached_input_cost: 0.25
      reasoning_effort: low
    accounts/fireworks/models/inkling:
      input_cost: 1.00
      output_cost: 4.05
      cached_input_cost: 0.17

# Together AI (OpenAI-compatible). Serverless inference only.
# Model IDs are slash-delimited HF-style and case-sensitive.
# Where Together publishes no cached-input rate (the Qwen SKUs), cached_input_cost
# is left unset and cached reads bill at input_cost.
#
# Rates and IDs from docs.together.ai/docs/serverless-models, 2026-10-11.
#
# Removed 2026-10-11, each on a live HTTP 400, with the removal dates from
# docs.together.ai/docs/deprecations:
#   - deepseek-ai/DeepSeek-V4-Pro and its -reasoning / -hard profiles (removed
#     from serverless 2026-08-27), Qwen/Qwen3-235B-A22B-fp8-tput (2026-02-06),
#     zai-org/GLM-5.1 (2026-07-10), zai-org/GLM-5 (2026-06-22): "Unable to
#     access non-serverless model".
#   - moonshotai/Kimi-K2.6 (2026-08-19): "No deployments are ready to serve this
#     endpoint; all configured deployments are stopped."
#
# Reasoning on Together, measured 2026-10-11 with scripts/check_reasoning.py: a
# one-word classification prompt, two runs (output tokens for each run). Most
# models reason by default and bill it as output. An entry sets
# reasoning_effort: low only where low lowered it in BOTH runs:
#   GLM-5.3                 default 114, 76    low 4, 3      cannot be disabled
#   GLM-5.3-Flash           default 62, 88     low 3, 11
#   Kimi-K3                 default 78, 131    low 15, 16
#   Qwen3.8-2.4T-A95B       default 62, 184    low 44, 40    'high' and 'none'
#                           are rejected (HTTP 400, chat template error)
# Left at the vendor default, because effort has no effect there:
#   DeepSeek-V4-Pro-0813    default 65, 53     low 30, 64    the first run looked
#   DeepSeek-V4.1-Flash     default 50, 65     low 31, 50    like a saving and the
#                           second showed it was noise; off with
#                           thinking: disabled -> 3
#   GLM-5.2                 default 278, 260   low 278, 262  off with
#                           thinking: disabled -> 2
#   Qwen3.5-9B              default 378        low 411       off only with
#                           reasoning.enabled=false, which the provider cannot send
#   Inkling                 default 69 (62)    low 67        off only with
#                           reasoning_effort 'none', which the provider rejects
together:
  models:
    # Added 2026-10-11 from the catalog and confirmed with a live call the same
    # day.
    deepseek-ai/DeepSeek-V4-Pro-0813:
      input_cost: 1.32
      output_cost: 3.96
      cached_input_cost: 0.13
    deepseek-ai/DeepSeek-V4.1-Flash:
      input_cost: 0.30
      output_cost: 1.20
      cached_input_cost: 0.006
    zai-org/GLM-5.3:
      input_cost: 1.40
      output_cost: 4.40
      cached_input_cost: 0.26
      reasoning_effort: low
    zai-org/GLM-5.3-Flash:
      input_cost: 0.15
      output_cost: 0.50
      cached_input_cost: 0.03
      reasoning_effort: low
    moonshotai/Kimi-K3:
      input_cost: 2.70
      output_cost: 13.50
      cached_input_cost: 0.30
      reasoning_effort: low
    # Qwen. Added 2026-10-11 from the catalog (Qwen3.6-Plus and Qwen3.5-9B were
    # already registered) and called live the same day.
    Qwen/Qwen3.8-2.4T-A95B:
      input_cost: 2.00
      output_cost: 6.00
      cached_input_cost: 0.50
      reasoning_effort: low
    # STREAMING ONLY: Qwen3.6-Plus, Qwen3.7-Max, Qwen3.7-Plus and Qwen3.8-Flash.
    # A non-streaming call to any of them returns HTTP 400 'This model only
    # supports streaming. Set "stream": true.', so get_response() and the JSON
    # and structured paths fail; only get_response_stream() works. The catalog
    # lists these four without a quantization, which is the tell.
    Qwen/Qwen3.6-Plus:
      input_cost: 0.50
      output_cost: 3.00
    Qwen/Qwen3.7-Max:
      input_cost: 2.50
      output_cost: 7.50
      cached_input_cost: 0.50
    Qwen/Qwen3.7-Plus:
      input_cost: 0.32
      output_cost: 1.28
    Qwen/Qwen3.8-Flash:
      input_cost: 0.15
      output_cost: 0.47
    Qwen/Qwen3.5-9B:
      input_cost: 0.17
      output_cost: 0.25
    zai-org/GLM-5.2:
      input_cost: 1.40
      output_cost: 4.40
      cached_input_cost: 0.26
    thinkingmachines/Inkling:
      input_cost: 1.00
      output_cost: 4.05
      cached_input_cost: 0.17

# Baseten Model APIs (OpenAI-compatible). The shared "Model APIs" catalog only;
# dedicated per-deployment endpoints are reached by passing their URL as base_url.
# Model IDs are HF-style and case-sensitive.
#
# Rates and the model list are from the aggregate table on baseten.co/pricing/,
# 2026-10-11. For availability, trust that table and the Model APIs docs list
# over the per-model pages under baseten.co/library/, which keep advertising a
# model after the shared endpoint has stopped serving it.
#
# Not registered, each on a live HTTP 410 "the model version you are trying to
# access has been deprecated": GLM-5.1 (2026-08-19), and DeepSeek-V4-Pro,
# Kimi-K2.6 and thinkingmachines/inkling (removed 2026-10-11). None of the four
# is in the pricing table.
#
# Reasoning on Baseten, measured 2026-10-11 the same way as Together above. An
# entry sets reasoning_effort: low only where low measurably lowers it:
#   GLM-5.3                 default 5 (2)      low 3 (0)
#   GLM-5.3-Flash           default 12 (10)    low 3 (0)
#   Kimi-K3                 default 92 (78)    low 15 (1)
# Left at the vendor default:
#   DeepSeek-V4-Pro-0813    default 63 (59)    low 65 (61)   effort has no
#   DeepSeek-V4.1-Flash     default 53 (49)    low 50 (46)   effect; off with
#                           thinking: disabled -> 3
#   GLM-5.2                 default 1 (0)      low 259 (256) reasoning is OPT-IN
#                           here, so any reasoning_effort turns it ON. Do not
#                           set one.
baseten:
  models:
    # Added 2026-10-11 from the pricing table and confirmed with a live call the
    # same day.
    zai-org/GLM-5.3:
      input_cost: 1.40
      output_cost: 4.40
      cached_input_cost: 0.14
      reasoning_effort: low
    zai-org/GLM-5.3-Flash:
      input_cost: 0.15
      output_cost: 0.50
      cached_input_cost: 0.03
      reasoning_effort: low
    deepseek-ai/DeepSeek-V4-Pro-0813:
      input_cost: 1.32
      output_cost: 3.96
      cached_input_cost: 0.132
      # Carried over from DeepSeek-V4-Pro on this host, which accepted
      # json_schema and then ignored it (prose on 5 of 5 live samples). Not
      # re-tested on the 0813 snapshot; fail fast until it is.
      supports_structured_outputs: false
    deepseek-ai/DeepSeek-V4.1-Flash:
      input_cost: 0.30
      output_cost: 1.20
      cached_input_cost: 0.007
    moonshotai/Kimi-K3:
      input_cost: 3.00
      output_cost: 15.00
      cached_input_cost: 0.30
      # "Cannot override enforced sampling params: {'top_p': 1.0}. Required
      # values: {'top_p': 0.95}" — omitting both params succeeds.
      supports_temperature_top_p: false
      reasoning_effort: low
    zai-org/GLM-5.2:
      input_cost: 1.40
      output_cost: 4.40
      cached_input_cost: 0.14

# Majordomo gateway (optimal routing). Canonical open-weight model names the
# Majordomo Steward gateway routes to the optimal backend (Fireworks, Together,
# …) at request time. These entries carry NO cost: the actual price is resolved
# per request from the backend the gateway selects, reported back via the
# X-Majordomo-Routed-Provider / X-Majordomo-Routed-Model response headers and
# looked up against that provider's rates above. Requires routing through the
# gateway (base_url + MAJORDOMO_API_KEY).
#
# The list mirrors what Steward routes. Verified live 2026-10-11: glm-5.2 and
# kimi-k3 route; deepseek-v4-pro was removed here after Steward answered HTTP 400
# "is not routable". glm-5.3 was added on the operator's word. kimi-k2.6, glm-5.1
# and inkling have not been re-checked.
majordomo:
  models:
    glm-5.3: {}
    glm-5.2: {}
    kimi-k3: {}
    kimi-k2.6: {}
    glm-5.1: {}
    inkling: {}

# Image-generation models use modality-specific token pricing. They are kept
# separate from text models because their response contract and output billing
# are different from LLMResponse. Rates confirmed 2026-08-26 from the official
# OpenAI GPT Image 2 announcement/model documentation and Gemini Developer API
# pricing page; all values are USD per million modality tokens.
image_generation:
  openai:
    models:
      gpt-image-2:
        text_input_cost: 5.00
        image_input_cost: 8.00
        text_output_cost: 10.00
        image_output_cost: 30.00
  gemini:
    models:
      gemini-3.1-flash-image:
        text_input_cost: 0.50
        image_input_cost: 0.50
        text_output_cost: 3.00
        image_output_cost: 60.00
      gemini-3.1-flash-lite-image:
        text_input_cost: 0.25
        image_input_cost: 0.25
        text_output_cost: 1.50
        image_output_cost: 30.00

# Deprecated model mappings
# When a user requests a deprecated model, it is automatically replaced with
# the mapped model and a warning is logged. A replacement must itself be a
# registered model; mappings are not chained.
#
# Kept deliberately short: only models a vendor has withdrawn AND named a
# successor for. Anything else that leaves the registry is simply removed, and
# a request for it raises ConfigurationError ("Unknown model").
deprecated_models:
  anthropic:
    # Deprecated by Anthropic 2026-09-30, retiring 2026-11-30. Anthropic's
    # recommended replacement, which is also cheaper ($3/$15 -> $2/$10).
    claude-sonnet-4-5-20250929: claude-sonnet-5-5
  gemini:
    # Closed to new users; projects that used 2.5 before are still served. Each
    # maps to the replacement Google's 404 names for it, all of which cost more
    # (flash-lite $0.10/$0.40 -> $0.30/$2.50).
    gemini-2.5-pro: gemini-3.1-pro-preview
    gemini-2.5-flash: gemini-3.8-flash
    gemini-2.5-flash-lite: gemini-3.5-flash-lite

# Logical model aliases
# Single provider: alias_name: { provider: ..., model: ... }
# Cascade (failover): alias_name: { cascade: [{ provider: ..., model: ... }, ...] }
aliases:
  # OpenAI GPT-6 family
  openai-smart:
    provider: openai
    model: gpt-6-astra
  openai-balanced:
    provider: openai
    model: gpt-6.1-sol
  openai-fast:
    provider: openai
    model: gpt-6-luna
  fast:
    provider: anthropic
    model: claude-haiku-5-5
  thinking:
    provider: anthropic
    model: claude-sonnet-5-5
  smart:
    provider: anthropic
    model: claude-opus-5-5
  # Was gemini-2.5-flash-lite, which Google now refuses for new projects.
  cheap:
    provider: openai
    model: gpt-6-luna
  resilient-sonnet:
    cascade:
      - provider: anthropic
        model: claude-sonnet-5-5
      - provider: openai
        model: gpt-6.1-sol
      - provider: gemini
        model: gemini-3.8-flash
  # Cross-vendor cascades for the same underlying open-weight model.
  #
  # The deepseek-v4-pro, deepseek-v4-pro-reasoning and deepseek-v4-pro-hard
  # aliases were removed 2026-10-11: Fireworks and Together both dropped
  # DeepSeek V4 Pro from serverless, and only Together serves its 0813
  # successor, so there is no second host to cascade to.
  # The kimi-k2.6 and glm-5.1 aliases were removed 2026-10-11: Fireworks no
  # longer serves either model, and a cascade needs two members.
  kimi-k3:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/kimi-k3
      - provider: together
        model: moonshotai/Kimi-K3
  # All three hosts charge $1.40/$4.40 for GLM 5.3; Baseten leads on its cheaper
  # cached reads ($0.14 against $0.26).
  glm-5.3:
    cascade:
      - provider: baseten
        model: zai-org/GLM-5.3
      - provider: fireworks
        model: accounts/fireworks/models/glm-5p3
      - provider: together
        model: zai-org/GLM-5.3
  glm-5.2:
    cascade:
      - provider: baseten
        model: zai-org/GLM-5.2
      - provider: together
        model: zai-org/GLM-5.2
  inkling:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/inkling
      - provider: together
        model: thinkingmachines/Inkling
