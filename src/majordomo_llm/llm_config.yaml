    deepseek-v4-flash:
      input_cost: 0.14
      output_cost: 0.28
      reasoning_effort: medium
    deepseek-v4-pro:
      input_cost: 0.435
      output_cost: 0.87
      reasoning_effort: medium
    # Reasoning profile — Sonnet-with-extended-thinking class. Use for code
    # review, multi-step analysis, structured extraction under ambiguity.
    deepseek-v4-pro-reasoning:
      model: deepseek-v4-pro
      input_cost: 0.435
      output_cost: 0.87
      thinking: enabled
      reasoning_effort: medium
    # Hard problems — Opus-tier work: math, complex planning, deep debugging.
    deepseek-v4-pro-hard:
      model: deepseek-v4-pro
      input_cost: 0.435
      output_cost: 0.87
      thinking: enabled
