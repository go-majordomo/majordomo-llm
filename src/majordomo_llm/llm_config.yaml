# Amazon Bedrock (Converse API). us-east-1 on-demand pricing.
# For non-Anthropic models hosted on Bedrock. Anthropic Claude models live
# under the ``bedrock_mantle:`` block below, which uses the AWS-native
# Anthropic Messages API endpoint (better feature support — structured
# outputs, prompt caching, extended thinking — without Converse-shape
# limitations).
# Model IDs here use the "us." cross-region inference profile prefix when
# AWS publishes one (Llama 4). Moonshot / NVIDIA Nemotron / DeepSeek use the
# bare model ID and are region-pinned.
# Prompt caching is not wired for these Converse models (no cachePoint blocks
# are inserted), so cache-read/write token counts are always 0 and no cache
# pricing is configured.
bedrock:
  models:
    # Moonshot (Kimi) on Bedrock — base model IDs, no cross-region profile.
    # Note AWS uses different prefixes ("moonshot." vs "moonshotai.") per model.
    moonshot.kimi-k2-thinking:
      input_cost: 0.60
      output_cost: 2.50
    moonshotai.kimi-k2.5:
      input_cost: 0.60
      output_cost: 3.00
    # NVIDIA Nemotron on Bedrock — base model IDs.
    nvidia.nemotron-nano-12b-v2:
      input_cost: 0.06
      output_cost: 0.23
    nvidia.nemotron-nano-3-30b:
      input_cost: 0.06
      output_cost: 0.24
    nvidia.nemotron-super-3-120b:
      input_cost: 0.15
      output_cost: 0.65
    # Meta Llama 4 on Bedrock (cross-region inference profiles)
    us.meta.llama4-maverick-17b-instruct-v1:0:
      input_cost: 0.24
      output_cost: 0.97
      max_tokens: 8192
    us.meta.llama4-scout-17b-instruct-v1:0:
      input_cost: 0.17
      output_cost: 0.66
      max_tokens: 8192
    # DeepSeek on Bedrock (Standard tier)
    us.deepseek.r1-v1:0:
      input_cost: 1.35
      output_cost: 5.40
      max_tokens: 32768
    deepseek.v3.2:
      input_cost: 0.62
      output_cost: 1.85

# Amazon Bedrock Mantle — Anthropic Claude via AWS-native Messages API.
# Endpoint: https://bedrock-mantle.{region}.api.aws/anthropic
# Model IDs are bare ``anthropic.claude-<name>`` (no ``us.`` prefix, no ``-v1``
# suffix). Auth via AWS_BEARER_TOKEN_BEDROCK + AWS_REGION. Opus 4.7+ and
# Sonnet 4.5+ deprecate temperature/top_p/top_k — supports_temperature_top_p
# must be false for those models.
# https://platform.claude.com/docs/en/build-with-claude/claude-in-amazon-bedrock
bedrock_mantle:
  models:
    anthropic.claude-opus-5:
      input_cost: 5.00
      output_cost: 25.00
      cached_input_cost: 0.50
      cache_write_cost: 6.25
      supports_temperature_top_p: false
    anthropic.claude-opus-4-8:
      input_cost: 5.00
      output_cost: 25.00
      cached_input_cost: 0.50
      cache_write_cost: 6.25
      supports_temperature_top_p: false
    anthropic.claude-opus-4-7:
