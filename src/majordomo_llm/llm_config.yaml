# LLM Provider Configuration
# Costs are specified in USD per million tokens.
#
# Prompt-cache pricing (optional per model):
#   cached_input_cost  – price per million cache-READ tokens.
#   cache_write_cost   – price per million cache-CREATION tokens (Anthropic /
#                        Bedrock only; other providers have no distinct write rate).
# When a field is omitted, no cache cost is modelled for that token class:
#   - OpenAI-family (subset accounting): cached reads fall back to input_cost.
#   - Anthropic/Bedrock (additive accounting): cache read/write contribute 0.
# The values below follow each provider's published, stable cache-pricing
# convention rather than per-model quotes:
#   - Anthropic / Bedrock Mantle: read = 0.10x input, 5-min write = 1.25x input.
#     Two models publish a cheaper read: claude-opus-5-5 (0.05x) and
#     claude-fable-5-1 (0.025x).
#   - Prompt-length tiers are not modelled. Where a vendor charges more above a
#     prompt-size threshold (claude-haiku-5-5 over 100K, the GPT-6 / GPT-5.6
#     families over 272K, Gemini Pro over 200K) the lower tier is registered.
#   - OpenAI: cached = 0.10x input (gpt-6.1-sol: 0.05x). The GPT-6 and GPT-5.6
#     families also bill cache WRITES at 1.25x input, which is not modelled for
#     OpenAI.
#   - Gemini: cache read = 0.10x input (storage fees not modelled).
#   - Fireworks / Together / Baseten: cached_input_cost is set per model where
#     the host publishes a discounted cache tier, and left unset otherwise, in
#     which case cached reads bill at input_cost.

