# Deprecated model mappings
# When a user requests a deprecated model, it is automatically replaced with
# the provider-recommended replacement and a warning is logged.
deprecated_models:
  openai:
    gpt-4o: gpt-4.1
    gpt-4o-mini: gpt-4.1-mini
    gpt-5-pro: gpt-5.4-pro
    o1: o3
    o3-mini: o4-mini
  anthropic:
    claude-3-7-sonnet-20250219: claude-sonnet-4-6
    claude-3-5-haiku-20241022: claude-haiku-4-5-20251001
    claude-3-haiku-20240307: claude-haiku-4-5-20251001
  gemini:
    gemini-3-pro-preview: gemini-3.1-pro-preview
    gemini-3.1-flash-lite-preview: gemini-3.1-flash-lite
    gemini-2.0-flash: gemini-2.5-flash
    gemini-2.0-flash-lite: gemini-2.5-flash-lite

# Logical model aliases
# Single provider: alias_name: { provider: ..., model: ... }
# Cascade (failover): alias_name: { cascade: [{ provider: ..., model: ... }, ...] }
aliases:
  # OpenAI GPT-5.6 flagship family
  openai-smart:
    provider: openai
    model: gpt-5.6-sol
  openai-balanced:
    provider: openai
    model: gpt-5.6-terra
  openai-fast:
    provider: openai
    model: gpt-5.6-luna
  fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
  thinking:
    provider: anthropic
    model: claude-sonnet-5
  smart:
    provider: anthropic
    model: claude-opus-4-8
  cheap:
    provider: gemini
    model: gemini-2.5-flash-lite
  resilient-sonnet:
    cascade:
      - provider: anthropic
        model: claude-sonnet-4-20250514
      - provider: openai
        model: gpt-4.1
      - provider: gemini
        model: gemini-2.5-pro
  # Cross-vendor cascades for the same underlying open-weight model.
  # Order: Fireworks first (lower published price), Together as failover.
  deepseek-v4-pro:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/deepseek-v4-pro
      - provider: together
        model: deepseek-ai/DeepSeek-V4-Pro
  # Reasoning + hard cascades end at Sonnet/Opus as the quality safety net.
  # Use these as Sonnet-with-thinking / Opus replacements respectively.
  deepseek-v4-pro-reasoning:
    cascade:
      - provider: fireworks
        model: deepseek-v4-pro-reasoning
      - provider: together
        model: deepseek-v4-pro-reasoning
      - provider: anthropic
        model: claude-sonnet-4-6
  deepseek-v4-pro-hard:
    cascade:
      - provider: fireworks
        model: deepseek-v4-pro-hard
      - provider: together
        model: deepseek-v4-pro-hard
      - provider: anthropic
        model: claude-opus-4-7
  kimi-k2.6:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/kimi-k2p6
      - provider: together
        model: moonshotai/Kimi-K2.6
  glm-5.1:
    cascade:
      - provider: fireworks
        model: accounts/fireworks/models/glm-5p1
      - provider: together
        model: zai-org/GLM-5.1
