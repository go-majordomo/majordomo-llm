# Amazon Bedrock (Converse API). us-east-1 on-demand pricing.
# For non-Anthropic models hosted on Bedrock. Anthropic Claude models live
# under the ``bedrock_mantle:`` block below, which uses the AWS-native
# Anthropic Messages API endpoint (better feature support — structured
# outputs, prompt caching, extended thinking — without Converse-shape
# limitations).
# Model IDs here use the "us." cross-region inference profile prefix when
# AWS publishes one (Llama 4). Moonshot / NVIDIA Nemotron / DeepSeek use the
# bare model ID and are region-pinned.
bedrock:
  models:
    # Moonshot (Kimi) on Bedrock — base model IDs, no cross-region profile.
    # Note AWS uses different prefixes ("moonshot." vs "moonshotai.") per model.
    moonshot.kimi-k2-thinking:
      input_cost: 0.60
      output_cost: 2.50
    moonshotai.kimi-k2.5:
      input_cost: 0.60
      output_cost: 3.00
    # NVIDIA Nemotron on Bedrock — base model IDs.
    nvidia.nemotron-nano-12b-v2:
      input_cost: 0.06
      output_cost: 0.23
    nvidia.nemotron-nano-3-30b:
      input_cost: 0.06
      output_cost: 0.24
    nvidia.nemotron-super-3-120b:
      input_cost: 0.15
      output_cost: 0.65
    # Meta Llama 4 on Bedrock (cross-region inference profiles)
    us.meta.llama4-maverick-17b-instruct-v1:0:
      input_cost: 0.24
      output_cost: 0.97
    us.meta.llama4-scout-17b-instruct-v1:0:
      input_cost: 0.17
      output_cost: 0.66
    # DeepSeek on Bedrock (Standard tier)
    us.deepseek.r1-v1:0:
      input_cost: 1.35
      output_cost: 5.40
    deepseek.v3.2:
      input_cost: 0.62
      output_cost: 1.85

# Amazon Bedrock Mantle — Anthropic Claude via AWS-native Messages API.
# Endpoint: https://bedrock-mantle.{region}.api.aws/anthropic
# Model IDs are bare ``anthropic.claude-<name>`` (no ``us.`` prefix, no ``-v1``
# suffix). Auth via AWS_BEARER_TOKEN_BEDROCK + AWS_REGION. Opus 4.7+ and
# Sonnet 4.5+ deprecate temperature/top_p/top_k — supports_temperature_top_p
# must be false for those models.
# https://platform.claude.com/docs/en/build-with-claude/claude-in-amazon-bedrock
bedrock_mantle:
  models:
    anthropic.claude-opus-4-8:
      input_cost: 5.00
      output_cost: 25.00
      supports_temperature_top_p: false
    anthropic.claude-opus-4-7:
      input_cost: 5.00
      output_cost: 25.00
      supports_temperature_top_p: false
    # Sonnet 4.6 is not yet available on Bedrock Mantle (returns 404
    # not_found_error). Add when AWS lists it on the platform.claude.com page.
    anthropic.claude-haiku-4-5:
      input_cost: 1.00
      output_cost: 5.00
      supports_temperature_top_p: false

# Fireworks AI (OpenAI-compatible). Serverless inference only.
# Model IDs are fully qualified: accounts/fireworks/models/<slug>.
# Qwen3 and Llama 4 SKUs use parameter-count tier pricing rather than per-model
# headline pricing and are intentionally omitted here pending clarification.
fireworks:
  models:
    accounts/fireworks/models/deepseek-v4-pro:
      input_cost: 1.74
      output_cost: 3.48
      reasoning_effort: medium
    # Reasoning + hard profiles share the same upstream SKU; the ``model:``
    # override keeps the API model ID stable while exposing distinct YAML keys.
    deepseek-v4-pro-reasoning:
      model: accounts/fireworks/models/deepseek-v4-pro
      input_cost: 1.74
      output_cost: 3.48
      thinking: enabled
      reasoning_effort: medium
    deepseek-v4-pro-hard:
      model: accounts/fireworks/models/deepseek-v4-pro
      input_cost: 1.74
      output_cost: 3.48
      thinking: enabled
      reasoning_effort: high
    accounts/fireworks/models/kimi-k2p6:
      input_cost: 0.95
      output_cost: 4.00
    accounts/fireworks/models/glm-5p1:
      input_cost: 1.40
      output_cost: 4.40

